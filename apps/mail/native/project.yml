name: EnoughMail
options:
  bundleIdPrefix: tools.enough.mail
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: FGXHYHH9MC
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '2026.11.6'
    PRODUCT_NAME: EnoughMail
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Apple/Info.plist
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
targets:
  EnoughMail-iOS:
    type: application
    platform: iOS
    sources: [Apple]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.enough.mail
        CODE_SIGN_ENTITLEMENTS: Apple/iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
  EnoughMail-macOS:
    type: application
    platform: macOS
    sources: [Apple]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.enough.mail
        CODE_SIGN_ENTITLEMENTS: Apple/macOS.entitlements
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
schemes:
  EnoughMail-iOS:
    build:
      targets:
        EnoughMail-iOS: all
  EnoughMail-macOS:
    build:
      targets:
        EnoughMail-macOS: all
