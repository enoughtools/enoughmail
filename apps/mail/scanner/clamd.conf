Foreground yes
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
MaxThreads 1
MaxQueue 2
ConcurrentDatabaseReload no
SelfCheck 60
CommandReadTimeout 10
ReadTimeout 10
MaxScanTime 10000
StreamMaxLength 64M
MaxFileSize 64M
# ClamAV counts the original encoded MIME in addition to decoded/extracted bytes.
# Keep 64M raw + 100M expanded engine budget; preflight enforces expansion alone.
MaxScanSize 164M
MaxRecursion 5
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
ScanMail yes
ScanArchive yes
ScanPartialMessages no
DisableCache yes
LeaveTemporaryFiles no
